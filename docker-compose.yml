services:
  # llama-server는 네이티브 실행 (도커 아님)
  # 실행: .\llama-server.exe -m <model.gguf> -ngl 99 -c 8192 --flash-attn on --port 8080

  postgres:
    image: postgres:17
    container_name: gemma-postgres
    environment:
      POSTGRES_USER: gemma
      POSTGRES_PASSWORD: gemma
      POSTGRES_DB: gemma
    ports:
      - "5432:5432"
    volumes:
      - "F:/development/gemma-ai-structure/postgres/data:/var/lib/postgresql/data"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gemma -d gemma"]
      interval: 5s
      timeout: 5s
      retries: 10

  # 향후 RAG 확장용 벡터 DB (필요 시 주석 해제)
